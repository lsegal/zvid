[package]
name = "zvid-export-bridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# This crate is intentionally standalone: the application root is not a Rust
# workspace. Declaring an empty workspace also prevents Cargo from treating an
# unrelated parent checkout as this package's workspace when the project is
# built from a temporary directory.
[workspace]

[dependencies]
# Includes zvidlib's WebCodecs and macOS AudioToolbox export adapters.
zvidlib = { git = "https://github.com/lsegal/zvidlib", rev = "0fc8331c987f2e4cf49f616f14e618c0e5be5956" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"

[dev-dependencies]
futures = "0.3"
