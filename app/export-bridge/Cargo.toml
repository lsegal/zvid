[package]
name = "zvid-export-bridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# This crate is intentionally standalone: the application root is not a Rust
# workspace. Declaring an empty workspace also prevents Cargo from treating an
# unrelated parent checkout as this package's workspace when the project is
# built from a temporary directory.
[workspace]

[dependencies]
# The MP4 and WebM containers are always built. Export drives the browser's
# WebCodecs video and AAC encoders itself, so the only codec it needs from
# zvidlib is the Opus encoder for WebM audio. Keep the version identical to
# daw/Cargo.toml; `cargo xtask check` fails when the two drift apart.
zvidlib = { version = "0.5.0", default-features = false, features = ["opus-encoder"] }
# Builds the VP9 `vpcC` from the encoder's first key frame.
zvidlib-vp9-syntax = "0.5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
js-sys = "0.3.104"

[dev-dependencies]
futures = "0.3"
