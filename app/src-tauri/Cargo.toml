[package]
name = "zvid-tauri"
version = "0.0.0"
description = "Optional native harness for zvid"
authors = ["OpenAI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
font-kit = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tauri = { version = "=2.11.6", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
zvid-export-bridge = { path = "../export-bridge" }
tempfile = "3"

# The native side only hosts the webview and muxes exports, so optimize the
# release binary for size: drop symbols, link-time optimize in one codegen
# unit, and abort on panic rather than carry unwinding tables.
[profile.release]
opt-level = "s"
debug = false
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
