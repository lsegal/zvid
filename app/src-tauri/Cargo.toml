[package]
name = "zvid-tauri"
version = "0.0.0"
description = "Optional native harness for zvid"
authors = ["OpenAI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "0.22"
font-kit = "0.14"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "native-tls", "system-proxy"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "=2.11.6", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "sync", "time"] }
url = "2"

# The native side only hosts the webview, so optimize the release binary for
# size: drop symbols, link-time optimize in one codegen unit, and abort on
# panic rather than carry unwinding tables.
[profile.release]
opt-level = "s"
debug = false
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
