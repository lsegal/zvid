[package]
name = "zvid-tauri"
version = "0.0.0"
description = "Optional native harness for zvid"
authors = ["OpenAI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.5.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tauri = { version = "=2.9.3", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.6.0"
