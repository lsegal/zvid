[workspace]
resolver = "3"
members = [
    "crates/zvid-daw-core",
    "crates/zvid-capture",
    "crates/zvid-daw-ui",
    "crates/zvid-vst3",
    "crates/zvid-au",
    "plugin",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
zvid-daw-core = { path = "crates/zvid-daw-core" }
zvid-capture = { path = "crates/zvid-capture" }
zvid-daw-ui = { path = "crates/zvid-daw-ui" }
zvid-vst3 = { path = "crates/zvid-vst3" }
zvid-au = { path = "crates/zvid-au" }
# Keep this rev identical to app/export-bridge/Cargo.toml; `cargo xtask check`
# fails when the two drift apart.
zvidlib = { git = "https://github.com/lsegal/zvidlib", rev = "873d0deb975a72dde1408d6e8f6922849d15847d" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
