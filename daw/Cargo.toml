[workspace]
resolver = "3"
members = [
    "crates/zvid-daw-core",
    "crates/zvid-capture",
    "crates/zvid-daw-ui",
    "crates/zvid-vst3",
    "crates/zvid-au",
    "plugin",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
zvid-daw-core = { path = "crates/zvid-daw-core" }
zvid-capture = { path = "crates/zvid-capture" }
zvid-daw-ui = { path = "crates/zvid-daw-ui" }
zvid-vst3 = { path = "crates/zvid-vst3" }
zvid-au = { path = "crates/zvid-au" }
# Keep this rev identical to app/export-bridge/Cargo.toml; `cargo xtask check`
# fails when the two drift apart.
zvidlib = { git = "https://github.com/lsegal/zvidlib", rev = "0863b7e7d28a9b356711ee7333ea8ee2c9cafc47" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jpeg-encoder = "0.7"
# macOS camera capture (zvid-capture).
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-foundation", "objc2-core-media"] }
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
# Windows camera capture (zvid-capture).
windows = { version = "0.62", features = [
    "Devices_Enumeration",
    "Foundation",
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_Registry",
] }

# Recording converts every camera frame to BGRA for the encoder on the CPU,
# which unoptimized takes about 250 ms a 1080p frame. Optimize the crate so
# debug builds and `cargo test` still record 1080p30 in real time.
[profile.dev.package.zvid-capture]
opt-level = 3
