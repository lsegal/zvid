[workspace]
resolver = "3"
members = [
    "crates/zvid-daw-core",
    "crates/zvid-capture",
    "crates/zvid-daw-ui",
    "crates/zvid-vst3",
    "crates/zvid-au",
    "plugin",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
zvid-daw-core = { path = "crates/zvid-daw-core" }
zvid-capture = { path = "crates/zvid-capture" }
zvid-daw-ui = { path = "crates/zvid-daw-ui" }
zvid-vst3 = { path = "crates/zvid-vst3" }
zvid-au = { path = "crates/zvid-au" }
# Keep this rev identical to app/export-bridge/Cargo.toml; `cargo xtask check`
# fails when the two drift apart.
zvidlib = "0.4.1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
jpeg-encoder = "0.7"
# macOS camera capture (zvid-capture).
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-foundation", "objc2-core-media"] }
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
# Windows camera capture (zvid-capture).
windows = { version = "0.62", features = [
    "Devices_Enumeration",
    "Foundation",
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_Registry",
] }

# Recording converts every camera frame on the CPU and, without a hardware
# encoder (CI runners have no GPU), encodes it in zvidlib's software HEVC/AV1
# encoders. Unoptimized, that is seconds a frame. Optimize zvid-capture and
# every dependency so debug builds and `cargo test` still record in real time;
# workspace crates stay unoptimized for fast rebuilds and debugging.
[profile.dev.package.zvid-capture]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# Release bundles ship to users, so trade build time for size: drop symbols
# and link-time optimize the whole plugin in one codegen unit. Speed stays at
# opt-level 3 for real-time capture and encoding. Panics must keep unwinding
# so the plugin can recover from them (the AU wrapper catches them at the host
# boundary, and worker thread panics are reported, not fatal); `abort` would
# take the host DAW down with the plugin.
[profile.release]
opt-level = 3
debug = false
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "unwind"
