[package]
name = "zvid-daw-ui"
description = "Child-webview host, IPC bridge and zvid:// protocol for the plugin UI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
zvid-daw-core.workspace = true
zvidlib.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
http = "1"
include_dir = "0.7"
jpeg-encoder = "0.6"
raw-window-handle = "0.6"
wry = "0.53"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }

[dev-dependencies]
tao = "0.34"
