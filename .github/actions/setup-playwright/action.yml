name: Set up Playwright
description: Install pnpm, Node 22 and a package's dependencies, then a Playwright browser (Chromium by default, cached by Playwright version) and its system dependencies.

inputs:
  dir:
    description: The package directory whose Playwright runs the tests (app or daw/ui).
    required: true
  browser:
    description: The Playwright browser to install.
    required: false
    default: chromium

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: ${{ inputs.dir }}/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: pnpm install --frozen-lockfile

    - name: Get Playwright version
      id: playwright
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: playwright-${{ inputs.browser }}-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    # Downloads the browser only on a cache miss; the system packages are
    # installed every time.
    - name: Install browser
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: pnpm exec playwright install --with-deps ${{ inputs.browser }}
