name: CI

on:
  # ready_for_review runs the plugin UI's browser tests (daw-ui-e2e); listing
  # types replaces the defaults, so opened, synchronize and reopened are
  # listed too.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main
  # A manual run; full-suite runs every component test and every Playwright
  # spec, WebKit included, rather than those the branch's changes affect.
  # Nothing starts it automatically.
  workflow_dispatch:
    inputs:
      full-suite:
        description: Run every component test and Playwright spec
        type: boolean
        default: true

# A ready_for_review run gets its own group so a push right after marking
# the pull request ready can't cancel its browser tests.
concurrency:
  group: ci-${{ github.ref }}${{ github.event.action == 'ready_for_review' && '-ready' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          install-root: "true"

      # `tsc -b` in lint type-checks the dynamic import of the wasm bridge,
      # so the package must exist before linting.
      - name: Build export bridge
        working-directory: app
        run: wasm-pack build export-bridge --target web --out-dir pkg

      # The effect registries import src/fx/effects/index.generated.ts, which
      # is committed; fail when it no longer matches the effect folders.
      - name: Check generated FX index
        run: node app/scripts/gen-fx-index.mjs --check

      # `pnpm lint` type-checks daw/ui too.
      - name: Install plugin UI dependencies
        run: pnpm --dir daw/ui install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # The spec reporter ends the log with a recap of the failing tests;
      # app/scripts/github-test-reporter.mjs annotates each one and lists
      # them in the job summary. Local `pnpm test` keeps its usual output.
      - name: Unit tests
        if: ${{ !cancelled() }}
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=${{ github.workspace }}/app/scripts/github-test-reporter.mjs --test-reporter-destination=stdout
          TEST_SUMMARY_TITLE: App unit tests
        run: pnpm --dir app run test:unit

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm --dir app run build

      - name: Plugin UI unit tests
        if: ${{ !cancelled() }}
        env:
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=${{ github.workspace }}/app/scripts/github-test-reporter.mjs --test-reporter-destination=stdout
          TEST_SUMMARY_TITLE: Plugin UI unit tests
        run: pnpm --dir daw/ui run test

      - name: Plugin UI build
        if: ${{ !cancelled() }}
        run: pnpm --dir daw/ui run build

  # Picks the Vitest browser-mode component tests (pnpm test:component) to
  # run, by what changed: `vitest --changed` follows each test's imports, CSS
  # included, and a change to the global CSS or the harness reruns them all.
  # A pull request compares against its merge base with main, a push to main
  # against the commit main pointed at before it, and a manual run with
  # full-suite runs everything. It outputs how many files are selected and
  # the shards component-tests splits them across (componentTestShards in
  # app/scripts/component-tests.mjs). See app/ARCHITECTURE.md (Testing).
  component-select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      since: ${{ steps.select.outputs.since }}
      selected: ${{ steps.select.outputs.selected }}
      shards: ${{ steps.select.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Select component tests
        id: select
        working-directory: app
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full-suite }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          since=""
          case "$EVENT" in
            pull_request)
              since=$(git merge-base "origin/$BASE_REF" HEAD) ;;
            push)
              # A new branch has no before commit, and a force-push's may be
              # gone; run everything then.
              if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                since=$BEFORE
              fi ;;
            workflow_dispatch)
              if [ "$FULL" != "true" ]; then
                since=$(git merge-base origin/main HEAD)
              fi ;;
          esac
          if [ -n "$since" ]; then
            echo "Selecting the component tests affected since $since"
          else
            echo "Selecting every component test"
          fi
          pnpm exec vitest list ${since:+--changed "$since"} --filesOnly \
            --passWithNoTests --json="$RUNNER_TEMP/selected.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { componentTestShards } from "./scripts/component-tests.mjs";
            const files = JSON.parse(readFileSync(process.argv[1], "utf8"));
            for (const { file } of files) console.error(file);
            const shards = componentTestShards(files.length);
            console.error(files.length + " files in " + shards.length + " shards");
            console.log("selected=" + files.length);
            console.log("shards=" + JSON.stringify(shards));
          ' "$RUNNER_TEMP/selected.json" >> "$GITHUB_OUTPUT"
          echo "since=$since" >> "$GITHUB_OUTPUT"

  # Runs the selected component tests, split across parallel shards: on
  # Linux, Chromium runs headed under Xvfb, and Vitest runs a headed browser
  # one test file at a time. When none are selected, one shard passes
  # without running any.
  component-tests:
    name: component-tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [component-select, export-bridge]
    if: ${{ !cancelled() && needs.component-select.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.component-select.outputs.shards) }}
    env:
      SINCE: ${{ needs.component-select.outputs.since }}
      SELECTED: ${{ needs.component-select.outputs.selected }}
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - name: No tests selected
        if: env.SELECTED == '0'
        run: echo "No component test is affected by this change."

      - uses: actions/checkout@v4
        if: env.SELECTED != '0'
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-playwright
        if: env.SELECTED != '0'
        with:
          dir: app

      # Dialogs that probe export support import the harness, whose dynamic
      # import of the wasm bridge must resolve when Vite serves the tests.
      - uses: actions/download-artifact@v4
        if: env.SELECTED != '0'
        with:
          name: export-bridge-pkg
          path: app/export-bridge/pkg

      # test:component runs Chromium headed under Xvfb on Linux; see
      # app/scripts/component-tests.mjs.
      - name: Component tests
        if: env.SELECTED != '0'
        working-directory: app
        run: |
          echo "Running shard $SHARD of the component tests${SINCE:+ affected since $SINCE}"
          # Without a base commit, --all opts out of the script's local
          # changed-only default and runs the whole suite.
          select=(--all)
          if [ -n "$SINCE" ]; then select=(--changed "$SINCE"); fi
          pnpm test:component "${select[@]}" --shard "$SHARD" --passWithNoTests

      - name: Upload test output
        if: failure() && env.SELECTED != '0'
        uses: actions/upload-artifact@v4
        with:
          name: component-test-results-${{ matrix.shard }}
          # Vitest browser mode saves a screenshot of each failing test here.
          path: app/.vitest/attachments/failure-screenshots
          include-hidden-files: true
          if-no-files-found: ignore

  # Picks the Playwright specs (app/e2e) to run, as the component tests are
  # picked: a pull request compares against its merge base with main, a push
  # to main against the commit main pointed at before it, and a manual run
  # with full-suite runs everything. `playwright test --only-changed` selects
  # the specs that changed or import a changed file (a helper, or a module
  # under src/ a spec loads in Node). Specs load the app by URL, so it can't
  # see the app code they cover; that is the component tests' job. A change
  # to the Playwright config, the app lockfile or the e2e fixtures runs every
  # spec. See app/ARCHITECTURE.md (Testing).
  e2e-select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      since: ${{ steps.select.outputs.since }}
      chromium: ${{ steps.select.outputs.chromium }}
      webkit: ${{ steps.select.outputs.webkit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Lists the selected tests of the Chromium projects and of the WebKit
      # project (WEBKIT_SPECS in app/playwright.config.ts) without running
      # them, and outputs how many each has.
      - name: Select specs
        id: select
        working-directory: app
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full-suite }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          since=""
          case "$EVENT" in
            pull_request)
              since=$(git merge-base "origin/$BASE_REF" HEAD) ;;
            push)
              # A new branch has no before commit, and a force-push's may be
              # gone; run everything then.
              if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                since=$BEFORE
              fi ;;
            workflow_dispatch)
              if [ "$FULL" != "true" ]; then
                since=$(git merge-base origin/main HEAD)
              fi ;;
          esac
          if [ -n "$since" ] && ! git diff --quiet "$since" HEAD -- playwright.config.ts pnpm-lock.yaml e2e/fixtures; then
            echo "The Playwright config, the lockfile or the e2e fixtures changed"
            since=""
          fi
          if [ -n "$since" ]; then
            echo "Selecting the Playwright specs affected since $since"
          else
            echo "Selecting every Playwright spec"
          fi
          count() {
            pnpm exec playwright test --list ${since:+--only-changed="$since"} "$@" | tee /dev/stderr |
              sed -nE 's/^Total: ([0-9]+) tests? .*/\1/p'
          }
          chromium=$(count)
          webkit=$(PLAYWRIGHT_WEBKIT=1 count --project webkit)
          {
            echo "since=$since"
            echo "chromium=${chromium:?no test count}"
            echo "webkit=${webkit:?no test count}"
          } >> "$GITHUB_OUTPUT"

  # Builds the wasm export bridge once for the component tests and the
  # Playwright specs.
  export-bridge:
    needs: [component-select, e2e-select]
    if: ${{ !cancelled() && (needs.component-select.outputs.selected != '0' || needs.e2e-select.outputs.chromium != '0' || needs.e2e-select.outputs.webkit != '0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build export bridge
        working-directory: app
        run: wasm-pack build export-bridge --target web --out-dir pkg

      - uses: actions/upload-artifact@v4
        with:
          name: export-bridge-pkg
          path: app/export-bridge/pkg
          if-no-files-found: error
          retention-days: 1

  # Runs the selected specs in Chromium, unsharded. When none are selected,
  # it passes without running any.
  e2e:
    needs: [e2e-select, export-bridge]
    if: ${{ !cancelled() && needs.e2e-select.result == 'success' }}
    runs-on: ubuntu-latest
    # The whole suite in one job is slow.
    timeout-minutes: ${{ needs.e2e-select.outputs.since == '' && 120 || 30 }}
    env:
      SINCE: ${{ needs.e2e-select.outputs.since }}
      SELECTED: ${{ needs.e2e-select.outputs.chromium }}
    steps:
      - name: No specs selected
        if: env.SELECTED == '0'
        run: echo "No Playwright spec is affected by this change."

      - uses: actions/checkout@v4
        if: env.SELECTED != '0'
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-playwright
        if: env.SELECTED != '0'
        with:
          dir: app

      - uses: actions/download-artifact@v4
        if: env.SELECTED != '0'
        with:
          name: export-bridge-pkg
          path: app/export-bridge/pkg

      - name: Browser tests
        if: env.SELECTED != '0'
        working-directory: app
        run: pnpm exec playwright test ${SINCE:+--only-changed="$SINCE"}

      - name: Upload test output
        if: failure() && env.SELECTED != '0'
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: |
            app/test-results
            app/playwright-report
          if-no-files-found: ignore

  # The selected specs that also run in WebKit, the engine of Safari and
  # every iOS browser (WEBKIT_SPECS in app/playwright.config.ts), such as the
  # steady playback re-sync checks of #1111. Only this job installs WebKit.
  # It runs on macOS, whose WebKit plays media through AVFoundation as Safari
  # and iOS do; Linux WebKit's GStreamer backend seeks differently. When none
  # are selected, it passes on Linux without running any.
  e2e-webkit:
    needs: [e2e-select, export-bridge]
    if: ${{ !cancelled() && needs.e2e-select.result == 'success' }}
    runs-on: ${{ needs.e2e-select.outputs.webkit != '0' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      SINCE: ${{ needs.e2e-select.outputs.since }}
      SELECTED: ${{ needs.e2e-select.outputs.webkit }}
    steps:
      - name: No specs selected
        if: env.SELECTED == '0'
        run: echo "No WebKit spec is affected by this change."

      - uses: actions/checkout@v4
        if: env.SELECTED != '0'
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-playwright
        if: env.SELECTED != '0'
        with:
          dir: app
          browser: webkit

      - uses: actions/download-artifact@v4
        if: env.SELECTED != '0'
        with:
          name: export-bridge-pkg
          path: app/export-bridge/pkg

      - name: WebKit browser tests
        if: env.SELECTED != '0'
        working-directory: app
        env:
          PLAYWRIGHT_WEBKIT: "1"
        run: pnpm exec playwright test --project webkit ${SINCE:+--only-changed="$SINCE"}

      - name: Upload test output
        if: failure() && env.SELECTED != '0'
        uses: actions/upload-artifact@v4
        with:
          name: app-webkit-test-results
          path: |
            app/test-results
            app/playwright-report
          if-no-files-found: ignore

  # Drives the editor in headless Chromium against the web driver
  # (daw/ui/src/web), so it needs no Rust build. See ARCHITECTURE.md
  # (Testing). It is slow, so it runs on pushes to main and when a pull
  # request is marked ready for review; other pull request events skip it.
  daw-ui-e2e:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'ready_for_review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-playwright
        with:
          dir: daw/ui

      - name: Plugin UI browser tests
        run: pnpm --dir daw/ui run test:web

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daw-ui-test-results
          path: daw/ui/test-results
          if-no-files-found: ignore

  # Pull requests and pushes to main that don't touch /daw skip the `daw`
  # job. A push is compared against the commit main pointed at before it
  # (the push's `before` SHA), so a multi-commit push that changed /daw in
  # any of its commits still runs it. When the changed files can't be
  # determined (a new branch, a force-push whose old head can't be fetched,
  # or a filter error), `daw` is true and the job runs anyway. Only a push
  # has a `before` SHA: on other events it is null, and expressions compare
  # null and the all-zero SHA as the number 0, so the new-branch check must
  # be limited to pushes or every pull_request run would build the DAW.
  # A manual run (workflow_dispatch) always builds it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      daw: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outcome != 'success' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000') || steps.filter.outputs.daw == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        continue-on-error: true
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            daw:
              - daw/**
              - .github/workflows/ci.yml
              - app/export-bridge/Cargo.toml

  daw:
    name: daw (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.daw == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: daw
    steps:
      - uses: actions/checkout@v4

      # Fails when C/C++/Objective-C++ sources appear under /daw. Runs before
      # anything is built so the Rust-only rule holds even if compilation
      # breaks; `cargo xtask check` below repeats it with the zvidlib version check.
      - name: Rust-only check
        run: |
          forbidden=$(find . -path ./target -prune -o -type f \( -iname '*.cpp' -o -iname '*.cc' -o -iname '*.mm' \) -print)
          if [ -n "$forbidden" ]; then
            echo "::error::/daw is Rust only; remove: $forbidden"
            exit 1
          fi

      # zvid-daw-ui embeds daw/ui/dist, so build the frontend first; without
      # it the plugin embeds a placeholder page.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: daw/ui/pnpm-lock.yaml

      - name: Build plugin UI
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      # rustup installs the toolchain and components pinned in
      # daw/rust-toolchain.toml on first use.
      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daw -> target

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      # Runners have no cameras; this exercises the platform enumeration path.
      - name: List cameras
        run: cargo run --locked -p zvid-capture --example capture -- list

      # Live 12 runs Remote Scripts on Python 3.11.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Live companion tests
        working-directory: daw/live-remote-script
        run: python -m unittest discover tests

      - name: Repository checks
        run: cargo xtask check

      # The pinned Plugalyzer release the host tests run in; the key changes
      # whenever xtask/src/host.rs, which pins it, does.
      - uses: actions/cache@v4
        with:
          path: daw/target/test-host
          key: test-host-${{ runner.os }}-${{ hashFiles('daw/xtask/src/host.rs') }}

      # Loads the bundles in a third-party CLI host: sample-exact
      # pass-through at several block sizes and a state round trip, for VST3
      # and, on macOS, AU. See ARCHITECTURE.md (Testing).
      - name: Host integration tests
        run: cargo xtask host-test

      - name: Upload host test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-${{ matrix.os }}
          path: daw/target/host-test
          if-no-files-found: ignore

      # Installs the ad-hoc signed .component for the runner user and runs
      # Apple's AU validation against it.
      - name: Validate Audio Unit (auval)
        if: runner.os == 'macOS'
        run: |
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          rm -rf "$components/ZVID Capture.component"
          cp -R "target/bundle/ZVID Capture.component" "$components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep ZVcp
          auval -v aufx ZVcp ZVID

      # Runs pluginval (Tracktion's prebuilt release, pinned and checksummed
      # by xtask; nothing is compiled) on the VST3 bundle and, on macOS, on
      # the .component installed above. It fails the job on any failure.
      # - Strictness 10, the highest (5 is the usual host-compatibility bar),
      #   set by PLUGINVAL_STRICTNESS in daw/xtask. Don't lower it to pass.
      # - The editor tests run too: WebView2 and WKWebView both open on the
      #   hosted runners, so there is no --skip-gui-tests.
      # - The runners have no cameras, so this covers that case.
      # - Steinberg's VST3 validator is not run: it has no maintained
      #   prebuilt binary and would mean building the C++ SDK. pluginval
      #   covers state, bus layouts, processing and parameter fuzzing; add
      #   it (pluginval's --vst3validator) only if a host hits a VST3
      #   conformance bug pluginval misses.
      # The key changes whenever xtask/src/main.rs, which pins it, does.
      - uses: actions/cache@v4
        with:
          path: daw/target/tools
          key: pluginval-${{ runner.os }}-${{ hashFiles('daw/xtask/src/main.rs') }}

      - name: Validate plugins (pluginval)
        run: cargo xtask validate
