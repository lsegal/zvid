name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          install-root: "true"

      # `tsc -b` in lint type-checks the dynamic import of the wasm bridge,
      # so the package must exist before linting.
      - name: Build export bridge
        working-directory: app
        run: wasm-pack build export-bridge --target web --out-dir pkg

      # `pnpm lint` type-checks daw/ui too.
      - name: Install plugin UI dependencies
        run: pnpm --dir daw/ui install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests and build
        if: ${{ !cancelled() }}
        run: pnpm --dir app run test

      - name: Plugin UI unit tests and build
        if: ${{ !cancelled() }}
        run: |
          pnpm --dir daw/ui run test
          pnpm --dir daw/ui run build

  daw:
    name: daw (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: daw
    steps:
      - uses: actions/checkout@v4

      # Fails when C/C++/Objective-C++ sources appear under /daw. Runs before
      # anything is built so the Rust-only rule holds even if compilation
      # breaks; `cargo xtask check` below repeats it with the zvidlib rev check.
      - name: Rust-only check
        run: |
          forbidden=$(find . -path ./target -prune -o -type f \( -iname '*.cpp' -o -iname '*.cc' -o -iname '*.mm' \) -print)
          if [ -n "$forbidden" ]; then
            echo "::error::/daw is Rust only; remove: $forbidden"
            exit 1
          fi

      # zvid-daw-ui embeds daw/ui/dist, so build the frontend first; without
      # it the plugin embeds a placeholder page.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: daw/ui/pnpm-lock.yaml

      - name: Build plugin UI
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      # rustup installs the toolchain and components pinned in
      # daw/rust-toolchain.toml on first use.
      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daw -> target

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Repository checks
        run: cargo xtask check
