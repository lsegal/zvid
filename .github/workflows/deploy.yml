name: Deploy Worker

# Deploys every merge to main. The ZVID Capture installers are not part of
# the deploy: the DAW bundles workflow publishes them to the zvid-downloads R2
# bucket, which the Worker serves at /downloads.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # wrangler.jsonc's build command builds the app.
      - name: Deploy
        working-directory: app
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
