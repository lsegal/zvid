name: DAW bundles

# Release ZVID Capture bundles and the plugin-only installer (bundle job), and
# the zvid desktop app's own installer (desktop job), for every merge to main,
# uploaded as separate workflow artifacts. Pull requests that touch /daw or
# the desktop app build the same bundles and installers, so a broken x86_64
# slice, release-only build or bundle layout fails the PR rather than main;
# PR runs upload nothing. macOS builds are Developer ID signed and notarized
# when the Apple secrets below are configured, and ad-hoc signed otherwise.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # app/export-bridge/Cargo.toml pins the zvidlib rev `cargo xtask check`
    # compares against.
    paths:
      - daw/**
      - app/src-tauri/**
      - .github/workflows/daw-bundle.yml
      - .github/workflows/ci.yml
      - app/export-bridge/Cargo.toml
  workflow_dispatch:

# Superseded PR runs are canceled; main runs always finish so every merge
# keeps its artifacts.
concurrency:
  group: daw-bundle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    name: bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-universal
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: daw
    steps:
      - uses: actions/checkout@v4

      # zvid-daw-ui embeds daw/ui/dist; `cargo xtask bundle --release` fails
      # without it rather than shipping the placeholder page.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: daw/ui/pnpm-lock.yaml

      - name: Build plugin UI
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      # rustup installs the toolchain and components pinned in
      # daw/rust-toolchain.toml on first use.
      - name: Install toolchain
        run: |
          rustup toolchain install
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      # PR runs restore main's release cache (same key) but don't save their
      # own, so main's entry isn't evicted by per-PR copies.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daw -> target
          save-if: ${{ github.event_name != 'pull_request' }}

      # Imports the Developer ID Application and Installer certificates into a
      # temporary keychain and exports their identities for `cargo xtask
      # bundle`. Without the secrets the bundles stay ad-hoc signed and the
      # installer unsigned.
      - name: Import signing certificates (macOS)
        id: signing
        if: runner.os == 'macOS'
        env:
          APPLICATION_P12: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          if [ -z "$APPLICATION_P12" ] || [ -z "$INSTALLER_P12" ]; then
            echo "::notice::Apple signing secrets are not set; building ad-hoc signed bundles and an unsigned installer"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for p12 in "$APPLICATION_P12" "$INSTALLER_P12"; do
            echo "$p12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          done
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity() {
            security find-identity -v "$keychain" | sed -n "s/.*\"\($1: .*\)\"/\1/p" | head -n 1
          }
          application=$(identity "Developer ID Application")
          installer=$(identity "Developer ID Installer")
          if [ -z "$application" ] || [ -z "$installer" ]; then
            echo "::error::the certificates lack a Developer ID Application or Installer identity"
            exit 1
          fi
          echo "ZVID_CODESIGN_IDENTITY=$application" >> "$GITHUB_ENV"
          echo "ZVID_INSTALLER_IDENTITY=$installer" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] && ! command -v iscc > /dev/null; then
            choco install innosetup --no-progress -y
          fi

      # Notarizes only when the installer is signed; without a signing
      # identity the notary secrets are left out.
      - name: Bundle
        env:
          ZVID_NOTARY_APPLE_ID: ${{ steps.signing.outputs.signed && secrets.APPLE_ID || '' }}
          ZVID_NOTARY_TEAM_ID: ${{ steps.signing.outputs.signed && secrets.APPLE_TEAM_ID || '' }}
          ZVID_NOTARY_PASSWORD: ${{ steps.signing.outputs.signed && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cargo xtask bundle --release --universal --installer
          else
            cargo xtask bundle --release --installer
          fi

      - name: Name the artifact
        id: name
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          sha=${GITHUB_SHA::7}
          stamped=$(grep -m 1 '"Version"' "target/bundle/ZVID Capture.vst3/Contents/Resources/moduleinfo.json")
          case "$stamped" in
            *"\"$version+$sha\""*) ;;
            *) echo "::error::bundle is not stamped $version+$sha: $stamped"; exit 1 ;;
          esac
          echo "name=zvid-capture-$version-$sha-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"

      - name: Verify universal binaries
        if: runner.os == 'macOS'
        run: |
          for binary in "target/bundle/ZVID Capture.vst3/Contents/MacOS/ZVID Capture" \
                        "target/bundle/ZVID Capture.component/Contents/MacOS/ZVID Capture"; do
            archs=$(lipo -archs "$binary")
            echo "$binary: $archs"
            for arch in x86_64 arm64; do
              case " $archs " in
                *" $arch "*) ;;
                *) echo "::error::$binary lacks $arch"; exit 1 ;;
              esac
            done
          done

      # Installs the .pkg as a user would, checks both bundles landed in
      # /Library/Audio/Plug-Ins with valid signatures, and runs Apple's AU validation against the installed
      # component.
      - name: Install and validate (macOS)
        if: runner.os == 'macOS'
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          NOTARIZED: ${{ steps.signing.outputs.signed && secrets.APPLE_ID != '' }}
        run: |
          pkg=$(ls target/installer/*.pkg)
          if [ "$SIGNED" = true ]; then
            pkgutil --check-signature "$pkg"
          fi
          if [ "$NOTARIZED" = true ]; then
            spctl --assess --type install --verbose "$pkg"
          fi
          sudo installer -pkg "$pkg" -target /
          for bundle in "/Library/Audio/Plug-Ins/VST3/ZVID Capture.vst3" \
                        "/Library/Audio/Plug-Ins/Components/ZVID Capture.component"; do
            test -f "$bundle/Contents/MacOS/ZVID Capture"
            codesign --verify --strict --verbose=2 "$bundle"
          done
          test ! -e /Applications/zvid.app
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep ZVcp
          auval -v aufx ZVcp ZVID

      # The pinned pluginval release, shared with the ci.yml daw job; the key
      # changes whenever xtask/src/main.rs, which pins it, does. rust-cache
      # prunes daw/target/tools, so it needs a cache of its own.
      - uses: actions/cache@v4
        with:
          path: daw/target/tools
          key: pluginval-${{ runner.os }}-${{ hashFiles('daw/xtask/src/main.rs') }}

      # pluginval against the release bundles, installed on macOS since
      # Audio Units only load from the plug-in folders. See the daw job in
      # ci.yml for the strictness, GUI test and VST3 validator choices.
      - name: Validate plugins (pluginval)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cargo xtask validate "/Library/Audio/Plug-Ins/VST3/ZVID Capture.vst3" \
              "/Library/Audio/Plug-Ins/Components/ZVID Capture.component"
          else
            cargo xtask validate
          fi

      # Runs the installer silently, checks the bundle landed in the shared
      # VST3 folder and no desktop app was installed, then uninstalls it and
      # checks it is gone.
      - name: Install and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/installer/*-setup.exe | Select-Object -First 1
          $flags = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $process = Start-Process $setup.FullName -ArgumentList $flags -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "setup exited with $($process.ExitCode)" }
          $bundle = Join-Path $env:CommonProgramFiles 'VST3\ZVID Capture.vst3'
          foreach ($file in 'Contents\x86_64-win\ZVID Capture.vst3', 'Contents\Resources\moduleinfo.json') {
            if (-not (Test-Path (Join-Path $bundle $file))) { throw "$file was not installed" }
          }
          $app = Join-Path $env:ProgramFiles 'ZVID\zvid.exe'
          if (Test-Path $app) { throw "the plugin installer installed the desktop app" }
          # The uninstaller relaunches itself from a temporary copy, so wait
          # for the files to disappear rather than for the process.
          $uninstaller = Join-Path $env:ProgramFiles 'ZVID\unins000.exe'
          Start-Process $uninstaller -ArgumentList $flags -Wait
          $installed = { @($bundle) | Where-Object { Test-Path $_ } }
          for ($i = 0; $i -lt 60 -and (& $installed); $i++) { Start-Sleep -Seconds 1 }
          foreach ($left in (& $installed)) { throw "uninstalling left $left behind" }

      # The pinned Plugalyzer release the host tests run in, shared with the
      # ci.yml daw job; the key changes whenever xtask/src/host.rs, which
      # pins it, does.
      - uses: actions/cache@v4
        with:
          path: daw/target/test-host
          key: test-host-${{ runner.os }}-${{ hashFiles('daw/xtask/src/host.rs') }}

      # The daw job runs these against debug bundles; this runs them against
      # the release bundles above: optimized, stamped, universal on macOS and
      # Developer ID signed when the secrets are set. Runs after the macOS
      # install step so auval there only sees the installed .component. See
      # ARCHITECTURE.md (Testing).
      - name: Host integration tests
        run: cargo xtask host-test --bundles target/bundle

      - name: Upload host test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-${{ matrix.platform }}
          path: daw/target/host-test
          if-no-files-found: ignore

      # ditto keeps the bundles' symlinks, permissions and signatures, which
      # the artifact upload's own zip would not. It archives one source, so
      # both bundles, the installer and the Live Remote Script go
      # into a folder that becomes the zip's top level.
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        working-directory: daw/target
        run: |
          name="${{ steps.name.outputs.name }}"
          rm -rf dist && mkdir -p "dist/$name"
          ditto "bundle/ZVID Capture.vst3" "dist/$name/ZVID Capture.vst3"
          ditto "bundle/ZVID Capture.component" "dist/$name/ZVID Capture.component"
          ditto "bundle/live-remote-script" "dist/$name/live-remote-script"
          cp installer/*.pkg "dist/$name/"
          ditto -c -k --keepParent "dist/$name" "dist/$name.zip"
          unzip -l "dist/$name.zip"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        working-directory: daw/target
        run: |
          rm -rf dist && mkdir -p dist
          cd bundle
          7z a -tzip "../dist/${{ steps.name.outputs.name }}.zip" "ZVID Capture.vst3" live-remote-script ../installer/*-setup.exe
          7z l "../dist/${{ steps.name.outputs.name }}.zip"

      # PRs only check that the bundles build and package; artifacts come
      # from main.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ${{ steps.name.outputs.name }}
          path: daw/target/dist/${{ steps.name.outputs.name }}.zip
          if-no-files-found: error

  # The zvid desktop app on its own, packaged by Tauri's bundler: a .dmg for
  # Apple silicon Macs, and an NSIS installer on Windows, which downloads the
  # WebView2 Runtime when Windows lacks it. Its artifacts are named
  # `zvid-<version>-<sha>-<platform>`, beside the plugin's `zvid-capture-*`
  # ones, and scripts/fetch-capture-installers.ts offers them as the desktop
  # app download.
  desktop:
    name: desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # The frontend embeds the export bridge, which the app's build script
      # builds for wasm32 with wasm-pack.
      - name: Install toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin
          fi

      # PR runs restore main's release cache but don't save their own. The
      # export bridge's wasm build has its own target directory.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target
            app/export-bridge -> target
          save-if: ${{ github.event_name != 'pull_request' }}

      # After rust-cache so this saves before rust-cache's post step prunes
      # ~/.cargo/bin of anything `cargo install` didn't put there.
      - name: Cache wasm-pack binary
        id: wasm-pack-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack${{ runner.os == 'Windows' && '.exe' || '' }}
          key: wasm-pack-bin-v1-${{ runner.os }}

      - name: Install wasm-pack
        if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Tauri signs the app with the Developer ID Application certificate and
      # notarizes it when APPLE_CERTIFICATE and APPLE_ID are in the
      # environment, so they're only exported when the secrets are set: an
      # empty APPLE_CERTIFICATE would fail the build.
      - name: Build desktop app installer
        id: build
        env:
          APPLICATION_P12: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          pnpm install --frozen-lockfile
          active='{"bundle":{"active":true}}'
          if [ "$RUNNER_OS" = macOS ]; then
            if [ -n "$APPLICATION_P12" ]; then
              export APPLE_CERTIFICATE="$APPLICATION_P12" APPLE_CERTIFICATE_PASSWORD="$P12_PASSWORD"
              echo "signed=true" >> "$GITHUB_OUTPUT"
              if [ -n "$NOTARY_APPLE_ID" ]; then
                export APPLE_ID="$NOTARY_APPLE_ID" APPLE_TEAM_ID="$NOTARY_TEAM_ID" APPLE_PASSWORD="$NOTARY_PASSWORD"
                echo "notarized=true" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "::notice::Apple signing secrets are not set; building an unsigned desktop app"
            fi
            pnpm tauri build --target aarch64-apple-darwin --bundles dmg --config "$active"
            built=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
            extension=.dmg
          else
            pnpm tauri build --bundles nsis --config "$active"
            built=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
            extension=-setup.exe
          fi
          version=$(node -p 'require("./package.json").version')
          sha=${GITHUB_SHA::7}
          mkdir -p target/desktop
          installer="target/desktop/zvid-$version+$sha$extension"
          mv "$built" "$installer"
          ls -l "$installer"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "name=zvid-$version-$sha-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"

      # Mounts the .dmg and checks the app in it is arm64 only and, when
      # signed, has a valid signature Gatekeeper accepts.
      - name: Verify (macOS)
        if: runner.os == 'macOS'
        env:
          INSTALLER: ${{ steps.build.outputs.installer }}
          SIGNED: ${{ steps.build.outputs.signed }}
          NOTARIZED: ${{ steps.build.outputs.notarized }}
        run: |
          mount="$RUNNER_TEMP/zvid-dmg"
          hdiutil attach "$INSTALLER" -nobrowse -readonly -mountpoint "$mount"
          app="$mount/zvid.app"
          executable=$(defaults read "$app/Contents/Info.plist" CFBundleExecutable)
          archs=$(lipo -archs "$app/Contents/MacOS/$executable")
          echo "$executable: $archs"
          if [ "$archs" != arm64 ]; then
            echo "::error::the desktop app must be arm64 only, has: $archs"
            exit 1
          fi
          if [ "$SIGNED" = true ]; then
            codesign --verify --deep --strict --verbose=2 "$app"
          fi
          if [ "$NOTARIZED" = true ]; then
            spctl --assess --type execute --verbose "$app"
          fi
          hdiutil detach "$mount"

      # Runs the installer silently, checks the app was installed, then
      # uninstalls it and checks it is gone. Tauri's NSIS installer installs
      # per user by default, into %LOCALAPPDATA%\zvid.
      - name: Install and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INSTALLER: ${{ steps.build.outputs.installer }}
        run: |
          $process = Start-Process (Resolve-Path $env:INSTALLER) -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "setup exited with $($process.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'zvid'
          $app = Get-ChildItem $dir -Filter *.exe | Where-Object Name -ne 'uninstall.exe' | Select-Object -First 1
          if (-not $app) { throw "the app was not installed into $dir" }
          Write-Output "installed $($app.FullName)"
          # The uninstaller relaunches itself from a temporary copy, so wait
          # for the app to disappear rather than for the process.
          Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $app.FullName); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app.FullName) { throw "uninstalling left $($app.FullName) behind" }

      # The artifact holds a zip of a folder with the installer, like the
      # plugin's, so scripts/fetch-capture-installers.ts reads both the same
      # way.
      - name: Zip
        env:
          INSTALLER: ${{ steps.build.outputs.installer }}
          NAME: ${{ steps.build.outputs.name }}
        run: |
          rm -rf target/dist && mkdir -p "target/dist/$NAME"
          cp "$INSTALLER" "target/dist/$NAME/"
          cd target/dist
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -c -k --keepParent "$NAME" "$NAME.zip"
          else
            7z a -tzip "$NAME.zip" "$NAME"
          fi

      # PRs only check that the installers build; artifacts come from main.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ${{ steps.build.outputs.name }}
          path: app/target/dist/${{ steps.build.outputs.name }}.zip
          if-no-files-found: error
