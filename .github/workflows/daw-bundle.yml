name: DAW bundles

# Release ZVID Capture bundles and the plugin installers for every merge to
# main, and publish the installers to the zvid-downloads R2 bucket under
# fixed names, overwriting the previous build's, where the app's Worker
# serves them at /downloads/capture. The zvid desktop app is not built or
# packaged here. Pull requests that touch /daw build the same bundles and
# installers, so a
# broken x86_64 slice, release-only build or bundle layout fails the PR rather
# than main; PR runs publish nothing. macOS builds are Developer ID signed and
# notarized when the Apple secrets below are configured, and ad-hoc signed
# otherwise.
#
# Publishing needs the CLOUDFLARE_ACCOUNT_ID secret and an API token with R2
# write access to the zvid-downloads bucket in CLOUDFLARE_R2_API_TOKEN
# (falling back to CLOUDFLARE_API_TOKEN when that is unset).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # app/export-bridge/Cargo.toml pins the zvidlib rev `cargo xtask check`
    # compares against.
    paths:
      - daw/**
      - .github/workflows/daw-bundle.yml
      - .github/workflows/ci.yml
      - app/export-bridge/Cargo.toml
  workflow_dispatch:

# Superseded PR runs are canceled; main runs always finish, one at a time,
# so every merge publishes its installers and they never interleave.
concurrency:
  group: daw-bundle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    name: bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-universal
            capture-platform: macos
            installer: zvid-capture-macos.pkg
            content-type: application/octet-stream
          - os: windows-latest
            platform: windows-x64
            capture-platform: windows
            installer: zvid-capture-windows-setup.exe
            content-type: application/vnd.microsoft.portable-executable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: daw
    steps:
      - uses: actions/checkout@v4

      # zvid-daw-ui embeds daw/ui/dist; `cargo xtask bundle --release` fails
      # without it rather than shipping the placeholder page.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: daw/ui/pnpm-lock.yaml

      - name: Build plugin UI
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      # rustup installs the toolchain and components pinned in
      # daw/rust-toolchain.toml on first use.
      - name: Install toolchain
        run: |
          rustup toolchain install
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      # PR runs restore main's release cache (same key) but don't save their
      # own, so main's entry isn't evicted by per-PR copies.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daw -> target
          save-if: ${{ github.event_name != 'pull_request' }}

      # Imports the Developer ID Application and Installer certificates into a
      # temporary keychain and exports their identities for `cargo xtask
      # bundle`. Without the secrets the bundles stay ad-hoc signed and the
      # installer unsigned.
      - name: Import signing certificates (macOS)
        id: signing
        if: runner.os == 'macOS'
        env:
          APPLICATION_P12: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          if [ -z "$APPLICATION_P12" ] || [ -z "$INSTALLER_P12" ]; then
            echo "::notice::Apple signing secrets are not set; building ad-hoc signed bundles and an unsigned installer"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for p12 in "$APPLICATION_P12" "$INSTALLER_P12"; do
            echo "$p12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          done
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity() {
            security find-identity -v "$keychain" | sed -n "s/.*\"\($1: .*\)\"/\1/p" | head -n 1
          }
          application=$(identity "Developer ID Application")
          installer=$(identity "Developer ID Installer")
          if [ -z "$application" ] || [ -z "$installer" ]; then
            echo "::error::the certificates lack a Developer ID Application or Installer identity"
            exit 1
          fi
          echo "ZVID_CODESIGN_IDENTITY=$application" >> "$GITHUB_ENV"
          echo "ZVID_INSTALLER_IDENTITY=$installer" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] && ! command -v iscc > /dev/null; then
            choco install innosetup --no-progress -y
          fi

      # Notarizes only when the installer is signed; without a signing
      # identity the notary secrets are left out.
      - name: Bundle
        env:
          ZVID_NOTARY_APPLE_ID: ${{ steps.signing.outputs.signed && secrets.APPLE_ID || '' }}
          ZVID_NOTARY_TEAM_ID: ${{ steps.signing.outputs.signed && secrets.APPLE_TEAM_ID || '' }}
          ZVID_NOTARY_PASSWORD: ${{ steps.signing.outputs.signed && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cargo xtask bundle --release --universal --installer
          else
            cargo xtask bundle --release --installer
          fi

      # The installer's name carries no version, so each main build replaces
      # the published one; the version is stamped into the bundles and the
      # installer instead.
      - name: Check the version stamp
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          sha=${GITHUB_SHA::7}
          stamped=$(grep -m 1 '"Version"' "target/bundle/ZVID Capture.vst3/Contents/Resources/moduleinfo.json")
          case "$stamped" in
            *"\"$version+$sha\""*) ;;
            *) echo "::error::bundle is not stamped $version+$sha: $stamped"; exit 1 ;;
          esac
          test -f "target/installer/${{ matrix.installer }}"

      - name: Verify universal binaries
        if: runner.os == 'macOS'
        run: |
          for binary in "target/bundle/ZVID Capture.vst3/Contents/MacOS/ZVID Capture" \
                        "target/bundle/ZVID Capture.component/Contents/MacOS/ZVID Capture"; do
            archs=$(lipo -archs "$binary")
            echo "$binary: $archs"
            for arch in x86_64 arm64; do
              case " $archs " in
                *" $arch "*) ;;
                *) echo "::error::$binary lacks $arch"; exit 1 ;;
              esac
            done
          done

      # Installs the .pkg as a user would, checks both bundles landed in
      # /Library/Audio/Plug-Ins with valid signatures, and runs Apple's AU validation against the installed
      # component.
      - name: Install and validate (macOS)
        if: runner.os == 'macOS'
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          NOTARIZED: ${{ steps.signing.outputs.signed && secrets.APPLE_ID != '' }}
        run: |
          pkg="target/installer/${{ matrix.installer }}"
          if [ "$SIGNED" = true ]; then
            pkgutil --check-signature "$pkg"
          fi
          if [ "$NOTARIZED" = true ]; then
            spctl --assess --type install --verbose "$pkg"
          fi
          sudo installer -pkg "$pkg" -target /
          for bundle in "/Library/Audio/Plug-Ins/VST3/ZVID Capture.vst3" \
                        "/Library/Audio/Plug-Ins/Components/ZVID Capture.component"; do
            test -f "$bundle/Contents/MacOS/ZVID Capture"
            codesign --verify --strict --verbose=2 "$bundle"
          done
          test ! -e /Applications/zvid.app
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep ZVcp
          auval -v aufx ZVcp ZVID

      # The pinned pluginval release, shared with the ci.yml daw job; the key
      # changes whenever xtask/src/main.rs, which pins it, does. rust-cache
      # prunes daw/target/tools, so it needs a cache of its own.
      - uses: actions/cache@v4
        with:
          path: daw/target/tools
          key: pluginval-${{ runner.os }}-${{ hashFiles('daw/xtask/src/main.rs') }}

      # pluginval against the release bundles, installed on macOS since
      # Audio Units only load from the plug-in folders. See the daw job in
      # ci.yml for the strictness, GUI test and VST3 validator choices.
      - name: Validate plugins (pluginval)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cargo xtask validate "/Library/Audio/Plug-Ins/VST3/ZVID Capture.vst3" \
              "/Library/Audio/Plug-Ins/Components/ZVID Capture.component"
          else
            cargo xtask validate
          fi

      # Runs the installer silently, checks the bundle landed in the shared
      # VST3 folder and no desktop app was installed, then uninstalls it and
      # checks it is gone.
      - name: Install and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-Item 'target/installer/${{ matrix.installer }}'
          $flags = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $process = Start-Process $setup.FullName -ArgumentList $flags -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "setup exited with $($process.ExitCode)" }
          $bundle = Join-Path $env:CommonProgramFiles 'VST3\ZVID Capture.vst3'
          foreach ($file in 'Contents\x86_64-win\ZVID Capture.vst3', 'Contents\Resources\moduleinfo.json') {
            if (-not (Test-Path (Join-Path $bundle $file))) { throw "$file was not installed" }
          }
          $app = Join-Path $env:ProgramFiles 'ZVID\zvid.exe'
          if (Test-Path $app) { throw "the plugin installer installed the desktop app" }
          # The uninstaller relaunches itself from a temporary copy, so wait
          # for the files to disappear rather than for the process.
          $uninstaller = Join-Path $env:ProgramFiles 'ZVID\unins000.exe'
          Start-Process $uninstaller -ArgumentList $flags -Wait
          $installed = { @($bundle) | Where-Object { Test-Path $_ } }
          for ($i = 0; $i -lt 60 -and (& $installed); $i++) { Start-Sleep -Seconds 1 }
          foreach ($left in (& $installed)) { throw "uninstalling left $left behind" }

      # The pinned Plugalyzer release the host tests run in, shared with the
      # ci.yml daw job; the key changes whenever xtask/src/host.rs, which
      # pins it, does.
      - uses: actions/cache@v4
        with:
          path: daw/target/test-host
          key: test-host-${{ runner.os }}-${{ hashFiles('daw/xtask/src/host.rs') }}

      # The daw job runs these against debug bundles; this runs them against
      # the release bundles above: optimized, stamped, universal on macOS and
      # Developer ID signed when the secrets are set. Runs after the macOS
      # install step so auval there only sees the installed .component. See
      # ARCHITECTURE.md (Testing).
      - name: Host integration tests
        run: cargo xtask host-test --bundles target/bundle

      - name: Upload host test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-${{ matrix.platform }}
          path: daw/target/host-test
          if-no-files-found: ignore

      # main only. Overwrites the installer in R2 under its fixed name, with
      # headers that make browsers download it and never serve a stale copy,
      # and records its size and hash for the manifest the publish job writes
      # once both platforms have uploaded.
      - name: Upload the installer to R2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: daw/target/installer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          INSTALLER: ${{ matrix.installer }}
          CONTENT_TYPE: ${{ matrix.content-type }}
          PLATFORM: ${{ matrix.capture-platform }}
        run: |
          npx --yes wrangler@4 r2 object put "zvid-downloads/capture/$INSTALLER" --remote \
            --file "$INSTALLER" --content-type "$CONTENT_TYPE" \
            --content-disposition "attachment; filename=\"$INSTALLER\"" \
            --cache-control no-cache
          size=$(wc -c < "$INSTALLER" | tr -d ' ')
          if command -v sha256sum > /dev/null; then
            sha256=$(sha256sum "$INSTALLER" | cut -d ' ' -f 1)
          else
            sha256=$(shasum -a 256 "$INSTALLER" | cut -d ' ' -f 1)
          fi
          mkdir -p ../published
          printf '{"platform":"%s","file":"%s","size":%s,"sha256":"%s"}\n' \
            "$PLATFORM" "$INSTALLER" "$size" "$sha256" | tee "../published/$PLATFORM.json"

      # The published installer's manifest entry, not the installer itself.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: capture-installer-${{ matrix.capture-platform }}
          path: daw/target/published/${{ matrix.capture-platform }}.json
          if-no-files-found: error
          retention-days: 1

  # Writes capture/manifest.json, which the app's Install Capture Plugin
  # dialog reads, only after every platform's installer uploaded, so it never
  # describes a half-updated pair.
  publish:
    name: publish manifest
    needs: bundle
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: capture-installer-*
          path: published
          merge-multiple: true

      - name: Upload the manifest to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' daw/Cargo.toml | head -n 1)
          jq -s --arg version "$version+${GITHUB_SHA::7}" --arg sha "$GITHUB_SHA" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, sha: $sha, builtAt: $builtAt, installers: sort_by(.platform)}' \
            published/*.json | tee manifest.json
          count=$(jq '.installers | length' manifest.json)
          if [ "$count" != 2 ]; then
            echo "::error::expected 2 installers, got $count"
            exit 1
          fi
          npx --yes wrangler@4 r2 object put zvid-downloads/capture/manifest.json --remote \
            --file manifest.json --content-type application/json --cache-control no-cache
