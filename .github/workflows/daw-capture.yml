name: DAW camera capture

on:
  pull_request:
    paths:
      - .github/workflows/daw-capture.yml
      - daw/crates/zvid-capture/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/daw-capture.yml
      - daw/crates/zvid-capture/**

concurrency:
  group: daw-capture-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zvid-capture:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: daw/crates/zvid-capture
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daw/crates/zvid-capture -> target

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      # Runners have no cameras; this exercises the platform enumeration path.
      - name: List devices
        run: cargo run --locked --example capture -- list
