name: macOS AAC fallback

on:
  pull_request:
    paths:
      - .github/workflows/macos-aac.yml
      - app/src-tauri/**
      - app/src/export-smoke.ts
      - app/src/harness/export.ts
      - app/src/harness/export-encoding.ts
      - app/src/harness/export-thumbnail.ts
      - app/export-bridge/**
      - app/scripts/verify-export.mjs
  workflow_dispatch:

jobs:
  native-aac:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Run the native AAC export smoke test
        working-directory: app/src-tauri
        run: cargo test --locked native_aac_fallback_produces_playable_mp4 -- --nocapture
      - name: Install app tools
        run: |
          brew install wasm-pack
          rustup target add wasm32-unknown-unknown
          cd app
          npx -y pnpm@10 install --frozen-lockfile
          npx -y pnpm@10 run build
      - name: Run the Tauri export smoke page
        working-directory: app
        run: |
          mkdir -p smoke-results
          printf '{"build":{"devUrl":"http://127.0.0.1:1420/export-smoke.html?automationOutputDir=%s"}}' "$PWD/smoke-results" > smoke-tauri.json
          npx -y pnpm@10 exec tauri dev --config smoke-tauri.json --no-watch > smoke-tauri.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if test -f smoke-results/smoke-native-aac.mp4; then
              node scripts/verify-export.mjs smoke-results/smoke-video-only.mp4 smoke-results/smoke-native-aac.mp4
              exit 0
            fi
            if test -f smoke-results/smoke-error.txt; then
              cat smoke-results/smoke-error.txt
              if test -f smoke-results/encoder-video.mp4; then
                ffprobe -v error -show_entries format=duration:stream=codec_name,duration -of json smoke-results/encoder-video.mp4
                ffprobe -v error -show_packets -select_streams v:0 -show_entries packet=dts,pts,duration -of compact smoke-results/encoder-video.mp4 | head -60
              fi
              cat smoke-tauri.log
              exit 1
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat smoke-tauri.log
              exit 1
            fi
            sleep 5
          done
          cat smoke-tauri.log
          exit 1
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-diagnostics
          path: app/smoke-results/
